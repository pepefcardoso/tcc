name: sports-wearable-dev

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: wearable_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d wearable_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/wearable_dev
      PG_POOL_MAX: 10
      JWT_USER_SECRET: dev-only-user-secret-32chars-minimum
      JWT_USER_EXPIRES_IN: 8h
      JWT_DEVICE_SECRET: dev-only-device-secret-32-chars-min
      JWT_DEVICE_EXPIRES_IN: 3650d
      UPLOAD_MAX_FILE_SIZE_MB: 100
      UPLOAD_TMP_DIR: /tmp/uploads
      GPS_BATCH_INSERT_SIZE: 500
      IMU_BATCH_INSERT_SIZE: 1000
    ports:
      - "3000:3000"
    volumes:
      - ../backend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
