name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wearable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d wearable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/wearable_test
      PG_POOL_MAX: 5
      JWT_USER_SECRET: ci-only-user-secret-that-is-at-least-32-chars
      JWT_DEVICE_SECRET: ci-only-device-secret-32chars-different
      JWT_USER_EXPIRES_IN: 8h
      JWT_DEVICE_EXPIRES_IN: 3650d
      UPLOAD_MAX_FILE_SIZE_MB: 100
      UPLOAD_TMP_DIR: /tmp/uploads
      GPS_BATCH_INSERT_SIZE: 500
      IMU_BATCH_INSERT_SIZE: 1000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Ensure upload temp directory exists
        run: sudo mkdir -p /tmp/uploads && sudo chmod 777 /tmp/uploads

      - name: Run Database Migrations
        working-directory: backend
        run: npm run migrate

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Run Unit Tests
        working-directory: backend
        run: npm run test

      - name: Run Integration Tests
        working-directory: backend
        run: npm run test:integration -- --runInBand
